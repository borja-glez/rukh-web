name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 from 2026-10-19, and this job
    # builds a Docker image and runs Playwright and Lighthouse, which is exactly the kind of work
    # that notices an OS bump. Move it on purpose, with a run that proves it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Docker build
        run: docker build -t rukh-web:ci .

      - name: Lighthouse (mobile and desktop)
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouseci
          path: |
            .lighthouseci
            lighthouse-reports
          if-no-files-found: ignore

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (mobile, tablet, desktop)
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: test-results/screens
          if-no-files-found: ignore
