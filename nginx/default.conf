server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Serve `.gz` siblings when present (none in P0; P2 precompresses the ORT wasm at build
  # time) and gzip text on the fly. `application/wasm` is deliberately absent: the 10-20 MB
  # runtime must never be compressed per request.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  include /etc/nginx/security-headers.conf;

  # Hashed build assets: immutable.
  location /_astro/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Board sprites (pieces and markers): one day.
  location ~ ^/(pieces|extensions)/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Self-hosted ONNX Runtime and model files (P2): long immutable cache and explicit MIME
  # types on top of the default mime.types included at http level.
  #
  # `.mjs` is not a typo for `.js`: nginx's bundled mime.types (checked in 1.29) has an entry
  # for `js` and none for `mjs`, so the ORT loader next to the `.wasm` went out as
  # `application/octet-stream`. With `X-Content-Type-Options: nosniff` the browser refuses to
  # evaluate it, the worker's dynamic `import()` of it fails and the session never initialises —
  # which is exactly the production-only failure this location fixes. `e2e/fixtures/coi-server.mjs`
  # reads these `default_type` declarations so the `isolated` E2E project fails if this goes away.
  location ~* \.mjs$ {
    include /etc/nginx/security-headers.conf;
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.wasm$ {
    include /etc/nginx/security-headers.conf;
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.onnx$ {
    include /etc/nginx/security-headers.conf;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(png|ico|svg|txt|xml)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
