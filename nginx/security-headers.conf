# Included in every location: nginx does not inherit add_header into a block that declares
# its own add_header, so each location pulls the full set from here.
#
# The page-level CSP (script/style hashes) lives in the <meta> tag generated by Astro;
# frame-ancestors cannot be set from <meta>, so it is added as a header.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Cross-origin isolation: required for multi-threaded WASM (onnxruntime-web, P2).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
